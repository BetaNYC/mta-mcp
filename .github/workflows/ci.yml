# Continuous integration for mta-mcp.
#
# Enforces that the TypeScript compiles cleanly and the whole suite passes on
# every pull request and every push to main, across both ends of the supported
# Node range, per platform/system/engineering-standards.md § 1 and § 3 in the
# BetaNYC workspace: tests run at both ends of the declared version range so
# version drift is caught before merge.
#
# Node matrix: 20.x and 22.x. package.json declares "engines.node >= 18", but
# Node 18 reached End-of-Life on 2025-04-30, so the floor tested here is Node 20
# (oldest actively-maintained LTS) with Node 22 as the ceiling. This matches the
# sibling repos nyc-311-mcp and nyc-charter-laws-rules.
#
# THIS JOB MAKES NO REQUEST TO MTA. `npm test` runs entirely against the
# fixtures in test/fixtures/ with fetch stubbed. The single live request this
# repo makes is `npm run smoke`, which is deliberately absent here: a CI job
# that fetches on every push is how a polite client becomes an impolite one.
#
# `npm test` is `npm run build && node --test dist/mta.test.js test/*.test.mjs`.
# The glob is deliberately UNQUOTED so the shell expands it and node receives
# literal file paths. Quoted, node does the matching itself, and Node 20 does
# not accept glob patterns as `node --test` arguments at all (added in 22) — it
# treats the pattern as a literal path and runs ZERO of the test/ files, while
# the explicit dist/mta.test.js path still runs, so the breakage looks like a
# partial pass rather than a miss. Do not re-add the quotes.
#
# There is no release.yml and no npm publish step, and that is deliberate: this
# package is private and is never published. See docs/terms-compliance.md. The
# What's changed release gate (`whats_changed.py check --release`) is therefore
# a step in the PR's last commit (CONTRIBUTING.md, "Releases"), and the
# whats-changed-released job below runs it on every push to main.

name: CI

on:
  # `test/**` matters: the tests are .mjs, so `**/*.ts` does not match them and
  # a test-only change would otherwise skip this gate entirely. `data/**` and
  # `scripts/**` matter because the bundled station list and its generator are
  # both under test.
  pull_request:
    branches: [main]
    paths:
      - "**/*.ts"
      - "test/**"
      - "data/**"
      - "scripts/**"
      - "skills/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - "WHATS-CHANGED.md"
      - "CHANGELOG.md"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "test/**"
      - "data/**"
      - "scripts/**"
      - "skills/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - "WHATS-CHANGED.md"
      - "CHANGELOG.md"
      - "docs/**"
  # Manual trigger — a path-scoped pull_request/push event does not fire on the
  # very PR that introduces the workflow, so without this the gate would never
  # run on its own PR.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20.x"
          - "22.x"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

  # The What's changed standard (betanyc-ai-workspace
  # platform/system/whats-changed-standard.md § 10). scripts/whats_changed.py is a copy of the
  # workspace's canonical file: never edit it here. `check --base-ref` needs the base branch's
  # history (fetch-depth: 0): old entries are append-only, and a package.json version bump
  # needs an MCP entry naming the new version. `render --check` fails when
  # docs/whats-changed.html no longer matches WHATS-CHANGED.md; rebuild it with the same
  # command without --check. Stdlib only, so no pip install, and no request to MTA.
  whats-changed:
    name: What's changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check WHATS-CHANGED.md
        run: python3 scripts/whats_changed.py check WHATS-CHANGED.md --base-ref "origin/${{ github.base_ref || 'main' }}"

      - name: The website's What's changed page matches the file
        run: >-
          python3 scripts/whats_changed.py render WHATS-CHANGED.md --format fragment
          --into docs/whats-changed.html
          --repo-url https://github.com/BetaNYC/mta-mcp --check

  # Release day is merge day here: people build whatever is on main, so an entry that reaches
  # main still headed "## Unreleased:" is a release without a date. The PR's last commit before
  # merge dates it (CONTRIBUTING.md, "Releases"). This job runs only on pushes to main and fails
  # loudly if that step was missed, so the gap is visible at once. Fix it with a follow-up PR
  # that dates the entry and the CHANGELOG heading.
  whats-changed-released:
    name: What's changed on main is dated
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: WHATS-CHANGED.md has no Unreleased entry
        run: python3 scripts/whats_changed.py check WHATS-CHANGED.md --release
