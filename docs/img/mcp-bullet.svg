<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     width="200" height="200" role="img" aria-labelledby="t d">
  <title id="t">MCP</title>
  <desc id="d">A BetaNYC-blue circle with the letters M C P in white.</desc>

  <!-- BetaNYC Blue #2359a8 (archive/betanyc/brand.md, finalized 2026-05-06).
       Deliberately NOT an MTA route indicator: MCP is not a subway route and
       no MTA mark is reproduced here. -->
  <circle cx="100" cy="100" r="100" fill="#2359a8"/>

  <!-- Letters are stroked geometry rather than type, so the mark needs no
       webfont and renders identically on every platform.

       Laid out to keep every stroke corner well inside the circle: the
       outermost corner sits ~80 from center against a radius of 100, which
       leaves visible padding at favicon size. An earlier pass ran the letters
       from x=27 to x=173 and they crowded the edge. -->
  <g fill="none" stroke="#fff" stroke-width="15"
     stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M34 132 V68 L55 104 L76 68 V132"/>
    <path d="M116 82 A23 23 0 1 0 116 118"/>
    <path d="M144 132 V68 A17 17 0 0 1 144 102"/>
  </g>
</svg>
